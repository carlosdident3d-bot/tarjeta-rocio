<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0d1c">
<meta property="og:title" content="Feliz cumpleaños, Rocío">
<meta property="og:image" content="rocio.jpg">
<title>Feliz cumpleaños, Rocío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna para móvil — retrato en cristal arriba, tocadiscos de cristal debajo, sobre un fondo de luces cálidas */
:root {
  --bg: #1a0d1c;
  --bg-2: #2b1230;
  --glow-a: #ff7a1a;
  --glow-b: #d93a6b;
  --glow-c: #7a3cff;
  --ink: #fff6ef;
  --ink-soft: rgba(255, 246, 239, .68);
  --glass: rgba(255, 255, 255, .09);
  --glass-2: rgba(255, 255, 255, .16);
  --edge: rgba(255, 255, 255, .22);
  --vinyl: #121014;
  --gold: #ffc477;
  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.luces { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%); }
.luces span { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: flotar 18s ease-in-out infinite alternate; }
.luces span:nth-child(1) { width: 70vw; height: 70vw; max-width: 520px; max-height: 520px; background: var(--glow-a); top: -12%; left: -20%; }
.luces span:nth-child(2) { width: 60vw; height: 60vw; max-width: 460px; max-height: 460px; background: var(--glow-b); top: 35%; right: -25%; animation-delay: -6s; }
.luces span:nth-child(3) { width: 55vw; height: 55vw; max-width: 420px; max-height: 420px; background: var(--glow-c); bottom: -15%; left: -10%; opacity: .35; animation-delay: -12s; }
@keyframes flotar { to { transform: translate(8%, 6%) scale(1.12); } }

.tarjeta {
  position: relative; z-index: 1;
  max-width: 440px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.cristal {
  background: linear-gradient(160deg, var(--glass-2), var(--glass) 60%);
  border: 1px solid var(--edge);
  border-radius: 28px;
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .25);
}

/* Cabecera */
.cabecera { text-align: center; display: grid; gap: 6px; }
.eyebrow { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-style: italic; font-size: clamp(40px, 12vw, 54px); line-height: 1; text-wrap: balance; letter-spacing: -.01em; }
h1 b { display: block; font-weight: 600; font-size: 1.28em; background: linear-gradient(100deg, #ffe0b8, var(--glow-a) 55%, var(--glow-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Retrato */
.retrato { padding: 12px; }
.retrato figure { margin: 0; position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 5 / 6; max-width: 100%; }
.retrato img { width: 100%; height: 100%; object-fit: cover; display: block; }
.retrato figcaption {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  padding: 10px 14px; border-radius: 14px;
  background: rgba(26, 13, 28, .38); border: 1px solid rgba(255, 255, 255, .2);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  font-family: var(--f-display); font-style: italic; font-size: 17px; text-align: center;
}

/* Tocadiscos */
.tocadiscos { padding: 22px 20px 20px; display: grid; gap: 18px; }
.mesa { position: relative; aspect-ratio: 1 / 1; max-width: 100%; }
.plato {
  position: absolute; inset: 4% 14% 4% 0;
  border-radius: 50%;
  background: radial-gradient(circle, #2a2530 0 68%, #3a3440 69% 71%, #1d1a22 72%);
  box-shadow: 0 18px 40px -10px rgba(0, 0, 0, .7), inset 0 0 0 1px rgba(255, 255, 255, .08);
  display: grid; place-items: center;
}
.disco {
  width: 92%; aspect-ratio: 1; border-radius: 50%;
  background:
    conic-gradient(from 30deg, rgba(255,255,255,.0) 0 40deg, rgba(255,255,255,.10) 60deg, rgba(255,255,255,0) 90deg 210deg, rgba(255,255,255,.08) 235deg, rgba(255,255,255,0) 265deg),
    repeating-radial-gradient(circle, var(--vinyl) 0 2px, #1d1a20 2.5px 3px),
    var(--vinyl);
  display: grid; place-items: center;
  animation: girar 1.8s linear infinite; animation-play-state: paused;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .6);
}
.disco.suena { animation-play-state: running; }
@keyframes girar { to { transform: rotate(360deg); } }
.etiqueta {
  width: 38%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; position: relative;
  border: 3px solid var(--glow-a);
  box-shadow: 0 0 0 4px rgba(0,0,0,.4);
}
.etiqueta img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
.etiqueta::after { content: ""; position: absolute; left: 50%; top: 50%; width: 9%; height: 9%; transform: translate(-50%, -50%); border-radius: 50%; background: #d8d2c8; box-shadow: 0 0 0 2px #1a1a1a; }

.brazo { position: absolute; top: 2%; right: 1%; width: 30%; height: 78%; transform-origin: 72% 9%; transform: rotate(-26deg); transition: transform .9s cubic-bezier(.5, .05, .25, 1); pointer-events: none; }
.brazo.puesto { transform: rotate(4deg); }
.brazo svg { width: 100%; height: 100%; overflow: visible; }

.estado { display: flex; align-items: center; gap: 14px; }
.play {
  flex: none; width: 68px; height: 68px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); cursor: pointer;
  background: linear-gradient(145deg, var(--glow-a), var(--glow-b));
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 12px 30px -8px rgba(255, 122, 26, .7), inset 0 1px 0 rgba(255,255,255,.4);
  transition: transform .15s ease;
}
.play:active { transform: scale(.94); }
.play:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.play svg { width: 26px; height: 26px; }
.play .i-pausa { display: none; }
.play[aria-pressed="true"] .i-play { display: none; }
.play[aria-pressed="true"] .i-pausa { display: block; }
.play:not([aria-pressed="true"]) { animation: latido 2.2s ease-in-out infinite; }
@keyframes latido { 0%, 100% { box-shadow: 0 12px 30px -8px rgba(255,122,26,.7), 0 0 0 0 rgba(255,122,26,.45); } 50% { box-shadow: 0 12px 30px -8px rgba(255,122,26,.7), 0 0 0 14px rgba(255,122,26,0); } }

.info { min-width: 0; flex: 1; display: grid; gap: 8px; }
.titulo { font-family: var(--f-display); font-style: italic; font-size: 19px; line-height: 1.1; }
.sub { color: var(--ink-soft); font-size: 13px; }
.barra { position: relative; height: 22px; display: flex; align-items: center; }
.barra input { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 22px; cursor: pointer; }
.barra input::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--glow-a) var(--p, 0%), rgba(255,255,255,.2) var(--p, 0%)); }
.barra input::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); }
.barra input::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--glow-a); }
.barra input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,122,26,.35); }
.barra input::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }
.tiempos { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.invita { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 0; }

.firma { text-align: center; font-family: var(--f-display); font-style: italic; font-size: 18px; color: var(--ink-soft); margin: 0; }
.firma strong { color: var(--ink); font-weight: 400; }

canvas#confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

@media (prefers-reduced-motion: reduce) {
  .luces span, .play { animation: none !important; }
  .disco { animation-duration: 6s; }
  .brazo { transition: none; }
}
</style>
</head>
<body>

<div class="luces" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas id="confeti" aria-hidden="true"></canvas>

<main class="tarjeta">
  <header class="cabecera">
    <span class="eyebrow">Para ti, con todo mi amor</span>
    <h1>Feliz cumpleaños <b>Rocío</b></h1>
  </header>

  <section class="cristal retrato">
    <figure>
      <img src="rocio.jpg" alt="Rocío sonriendo" width="800" height="960">
      <figcaption>Mi media naranja</figcaption>
    </figure>
  </section>

  <section class="cristal tocadiscos" aria-label="Tocadiscos con tu canción">
    <div class="mesa">
      <div class="plato">
        <div class="disco" id="disco">
          <div class="etiqueta"><img src="rocio.jpg" alt=""></div>
        </div>
      </div>
      <div class="brazo" id="brazo" aria-hidden="true">
        <svg viewBox="0 0 100 260">
          <defs>
            <linearGradient id="metal" x1="0" x2="1">
              <stop offset="0" stop-color="#8f8a94"/><stop offset=".5" stop-color="#f4efe9"/><stop offset="1" stop-color="#77727c"/>
            </linearGradient>
          </defs>
          <circle cx="72" cy="24" r="22" fill="#2a2530" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
          <circle cx="72" cy="24" r="10" fill="url(#metal)"/>
          <path d="M72 24 L72 170 Q72 200 52 222" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
          <rect x="34" y="216" width="30" height="40" rx="6" transform="rotate(38 49 236)" fill="#1d1a22" stroke="url(#metal)" stroke-width="3"/>
        </svg>
      </div>
    </div>

    <div class="estado">
      <button class="play" id="play" type="button" aria-pressed="false" aria-label="Reproducir tu canción">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="i-pausa" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
      </button>
      <div class="info">
        <div>
          <div class="titulo">Rocío, mi media naranja</div>
          <div class="sub">Tu canción · Cara A</div>
        </div>
        <div class="barra"><input id="posicion" type="range" min="0" max="211" step="0.1" value="0" aria-label="Posición de la canción"></div>
        <div class="tiempos"><span id="actual">0:00</span><span id="total">3:31</span></div>
      </div>
    </div>
    <p class="invita" id="invita">Pulsa play y deja que suene</p>
  </section>

  <p class="firma">Con todo mi corazón, <strong>tu media naranja</strong></p>
</main>

<audio id="audio" src="cancion.mp3" preload="metadata"></audio>

<script>
(() => {
  const audio = document.getElementById('audio');
  const play = document.getElementById('play');
  const disco = document.getElementById('disco');
  const brazo = document.getElementById('brazo');
  const pos = document.getElementById('posicion');
  const actual = document.getElementById('actual');
  const total = document.getElementById('total');
  const invita = document.getElementById('invita');
  let primera = true, arrastrando = false;

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const pintar = () => {
    const d = audio.duration || 210.8;
    pos.max = d; total.textContent = fmt(d);
    if (!arrastrando) pos.value = audio.currentTime;
    actual.textContent = fmt(arrastrando ? pos.value : audio.currentTime);
    pos.style.setProperty('--p', (100 * pos.value / d) + '%');
  };

  function estado(sonando) {
    play.setAttribute('aria-pressed', sonando);
    play.setAttribute('aria-label', sonando ? 'Pausar' : 'Reproducir tu canción');
    brazo.classList.toggle('puesto', sonando);
    invita.textContent = sonando ? 'Sonando para ti' : 'Pulsa play y deja que suene';
  }

  play.addEventListener('click', async () => {
    if (audio.paused) {
      estado(true);
      // el brazo baja antes de que empiece a sonar
      setTimeout(async () => {
        try {
          await audio.play();
          disco.classList.add('suena');
          if (primera) { primera = false; confeti(); }
        } catch (e) {
          estado(false);
          invita.textContent = 'No se ha podido reproducir. Vuelve a pulsar play.';
        }
      }, 650);
    } else {
      audio.pause();
    }
  });
  audio.addEventListener('pause', () => { disco.classList.remove('suena'); estado(false); });
  audio.addEventListener('ended', () => { audio.currentTime = 0; pintar(); });
  audio.addEventListener('timeupdate', pintar);
  audio.addEventListener('loadedmetadata', pintar);
  pos.addEventListener('input', () => { arrastrando = true; pintar(); });
  pos.addEventListener('change', () => { audio.currentTime = +pos.value; arrastrando = false; pintar(); });
  pintar();

  // confeti al primer play
  const cv = document.getElementById('confeti');
  const ctx = cv.getContext('2d');
  function confeti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cols = ['#ff7a1a', '#d93a6b', '#ffc477', '#ffffff', '#b98cff'];
    const ps = Array.from({ length: 140 }, () => ({
      x: innerWidth / 2, y: innerHeight * .55,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 5,
      r: Math.random() * 6 + 4, a: Math.random() * 6.28, va: (Math.random() - .5) * .3,
      c: cols[(Math.random() * cols.length) | 0], heart: Math.random() < .3
    }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        if (p.heart) {
          const s = p.r * .9; ctx.beginPath(); ctx.moveTo(0, s * .4);
          ctx.bezierCurveTo(-s * 1.2, -s * .4, -s * .5, -s * 1.3, 0, -s * .5);
          ctx.bezierCurveTo(s * .5, -s * 1.3, s * 1.2, -s * .4, 0, s * .4); ctx.fill();
        } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        ctx.restore();
      });
      if (++t < 180) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }
})();
</script>
</body>
</html>
